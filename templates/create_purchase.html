<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Purchase | PurchaseGuard</title>
</head>
<body>
    <h1>Add Purchase</h1>

    <form method="post">
        <div>
            <label for="item_name">Item name</label>
            <input
                type="text"
                id="item_name"
                name="item_name"
                required
            >
        </div>

        <div>
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
            >
        </div>

        <div>
            <label for="store_name">Store name</label>
            <input
                type="text"
                id="store_name"
                name="store_name"
            >
        </div>

        <div>
            <label for="purchase_date">Purchase date</label>
            <input
                type="date"
                id="purchase_date"
                name="purchase_date"
                required
            >
        </div>

        <div>
            <label for="price">Price</label>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
            >
        </div>

        <div>
            <label for="return_deadline">Return deadline</label>
            <input
                type="date"
                id="return_deadline"
                name="return_deadline"
            >
        </div>

        <div>
            <label for="warranty_end_date">Warranty end date</label>
            <input
                type="date"
                id="warranty_end_date"
                name="warranty_end_date"
            >
        </div>

        <div>
            <label for="notes">Notes</label>
            <textarea
                id="notes"
                name="notes"
                rows="4"
            ></textarea>
        </div>

        <button type="submit">Save Purchase</button>
    </form>

    <p>
        <a href="{{ url_for('index') }}">Back to purchases</a>
    </p>
</body>
</html>
